<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#241B18" />
      <stop offset="50%" stop-color="#1B1412" />
      <stop offset="100%" stop-color="#0F0C0B" />
    </linearGradient>
    <linearGradient id="terracottaGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EAA692" />
      <stop offset="60%" stop-color="#C86D51" />
      <stop offset="100%" stop-color="#9C442A" />
    </linearGradient>
    <linearGradient id="warmLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5F0" />
      <stop offset="100%" stop-color="#EBD8CE" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGradient)" />

  <!-- Ambient Bloom -->
  <circle cx="256" cy="256" r="140" fill="#C86D51" opacity="0.18" filter="url(#softGlow)" />

  <!-- Interlocking Tether Loops (symbolizing two connected partners) -->
  <g transform="translate(256, 256)">
    <!-- Left Loop (Partner 1) -->
    <ellipse cx="-45" cy="0" rx="90" ry="75" fill="none" stroke="url(#terracottaGlow)" stroke-width="26" stroke-linecap="round" />
    
    <!-- Right Loop (Partner 2) -->
    <ellipse cx="45" cy="0" rx="90" ry="75" fill="none" stroke="url(#warmLight)" stroke-width="26" stroke-linecap="round" opacity="0.95" />

    <!-- Center Intimacy Spark -->
    <circle cx="0" cy="0" r="12" fill="#EAA692" filter="url(#softGlow)" />
  </g>
</svg>
