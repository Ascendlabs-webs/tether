name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

# Needed to commit the persistent debug keystore back to the repo
# and to publish the APK to GitHub Releases.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        # Full history so the keystore commit-back step can push cleanly.
        fetch-depth: 0

    # NOTE: @capacitor/cli@8 requires Node >= 22 (it fatals on Node 20).
    # Vite 8 also accepts >=22.12, so Node 22 satisfies the whole chain.
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "22"
        cache: "npm"

    # ubuntu-latest already ships the Android SDK (ANDROID_HOME preset),
    # so no separate SDK setup action is used.
    # NOTE: @capacitor/android@8 targets Java 21 (source release 21), so the
    # whole build must run on JDK 21. Gradle 8.14 and AGP 8.13 both support it.
    - name: Setup Java 21
      uses: actions/setup-java@v4
      with:
        distribution: "zulu"
        java-version: "21"
        cache: "gradle"

    # compileSdk/targetSdk is 36, which is not guaranteed pre-installed on the
    # runner image. Install it (no-op if already present) using the runner's
    # own SDK tools — no third-party setup action needed (that broke run 7).
    # NOTE: sdkmanager is NOT on PATH, so resolve it under $ANDROID_HOME.
    - name: Ensure Android SDK platform and build-tools 36
      run: |
        SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
        if [ ! -f "$SDKMGR" ]; then
          echo "sdkmanager not at $SDKMGR, searching..."
          SDKMGR="$(find "$ANDROID_HOME" -maxdepth 4 -name sdkmanager -type f | head -1)"
        fi
        echo "Using sdkmanager: $SDKMGR"
        test -x "$SDKMGR"
        yes | "$SDKMGR" --licenses > /dev/null
        "$SDKMGR" "platforms;android-36" "build-tools;36.0.0"

    # package-lock.json is lockfileVersion 3 and in sync — npm ci is correct,
    # faster, and reproducible.
    - name: Install npm dependencies
      run: npm ci --legacy-peer-deps --no-audit --no-fund

    - name: Build web bundle
      run: npm run build

    # android/ is committed to the repo, so `cap add` is not needed.
    # Invokes the local CLI binary directly instead of via npx so the exact
    # Capacitor version from package-lock.json is always used.
    - name: Capacitor Sync
      run: ./node_modules/.bin/cap sync android

    - name: Grant Gradle execute permission
      run: chmod +x android/gradlew

    # Gradle auto-creates a throwaway debug keystore when none exists, and CI
    # runners are ephemeral — so every build was signed with a DIFFERENT key
    # and Android refused to install it over any previously installed copy
    # ("App not installed"). Generate one persistent keystore the first time
    # and commit it, so all builds and updates share a single signature.
    # The [skip ci] message prevents this push from triggering another run;
    # the current run continues and builds with the key it just created.
    - name: Ensure persistent debug keystore
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        if [ -f android/app/debug.keystore ]; then
          echo "debug.keystore already committed, reusing it."
          exit 0
        fi
        keytool -genkeypair -v \
          -keystore android/app/debug.keystore \
          -storepass android -keypass android \
          -alias androiddebugkey \
          -keyalg RSA -keysize 2048 -validity 10000 \
          -dname "CN=Android Debug,O=Android,C=US"
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add android/app/debug.keystore
        git commit -m "chore: commit persistent Android debug keystore [skip ci]"
        git push origin HEAD:${{ github.ref_name }}

    - name: Build Debug APK
      working-directory: ./android
      run: ./gradlew assembleDebug --no-daemon --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: tether-debug-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk

    # Permanent direct-to-phone download: the Actions artifact is a zip that
    # expires after 90 days; the release asset is the raw .apk, no expiry.
    - name: Publish APK to rolling GitHub Release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release delete apk-build --yes --cleanup-tag || true
        gh release create apk-build \
          --title "Tether APK (build ${{ github.run_number }})" \
          --notes "Latest CI debug build of Tether. If an older copy is installed, uninstall it once (old builds carried throwaway signatures), then install this APK." \
          --latest \
          android/app/build/outputs/apk/debug/app-debug.apk
