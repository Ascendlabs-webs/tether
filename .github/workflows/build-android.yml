name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"
        cache: "npm"

    # ubuntu-latest already ships the Android SDK (ANDROID_HOME preset),
    # so no separate SDK setup action is used.
    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: "zulu"
        java-version: "17"
        cache: "gradle"

    # package-lock.json is lockfileVersion 3 and in sync — npm ci is correct,
    # faster, and reproducible. (Requires npm 10+; never use npm 12 here.)
    - name: Install npm dependencies
      run: npm ci --legacy-peer-deps --no-audit --no-fund

    - name: Build web bundle
      run: npm run build

    - name: Verify web assets and Capacitor CLI
      run: |
        node --version
        npm --version
        ls -la dist | head -20
        test -f dist/index.html && echo "dist/index.html OK"
        ls node_modules/.bin/cap && echo "cap binary OK"
        ./node_modules/.bin/cap --version
        ./node_modules/.bin/cap doctor || true

    # android/ is committed to the repo, so `cap add` is not needed.
    # Invokes the local CLI binary directly instead of via npx so the exact
    # Capacitor version from package-lock.json is always used.
    - name: Capacitor Sync
      run: ./node_modules/.bin/cap sync android

    - name: Grant Gradle execute permission
      run: chmod +x android/gradlew

    - name: Build Debug APK
      working-directory: ./android
      run: ./gradlew assembleDebug --no-daemon --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: tether-debug-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
