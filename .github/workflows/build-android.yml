name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # NOTE: @capacitor/cli@8 requires Node >= 22 (it fatals on Node 20).
    # Vite 8 also accepts >=22.12, so Node 22 satisfies the whole chain.
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "22"
        cache: "npm"

    # ubuntu-latest already ships the Android SDK (ANDROID_HOME preset),
    # so no separate SDK setup action is used.
    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: "zulu"
        java-version: "17"
        cache: "gradle"

    # compileSdk/targetSdk is 36, which is not guaranteed pre-installed on the
    # runner image. Install it (no-op if already present) using the runner's
    # own SDK tools — no third-party setup action needed (that broke run 7).
    # NOTE: sdkmanager is NOT on PATH, so resolve it under $ANDROID_HOME.
    - name: Ensure Android SDK platform and build-tools 36
      run: |
        SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
        if [ ! -f "$SDKMGR" ]; then
          echo "sdkmanager not at $SDKMGR, searching..."
          SDKMGR="$(find "$ANDROID_HOME" -maxdepth 4 -name sdkmanager -type f | head -1)"
        fi
        echo "Using sdkmanager: $SDKMGR"
        test -x "$SDKMGR"
        yes | "$SDKMGR" --licenses > /dev/null
        "$SDKMGR" "platforms;android-36" "build-tools;36.0.0"

    # package-lock.json is lockfileVersion 3 and in sync — npm ci is correct,
    # faster, and reproducible.
    - name: Install npm dependencies
      run: npm ci --legacy-peer-deps --no-audit --no-fund

    - name: Build web bundle
      run: npm run build

    # android/ is committed to the repo, so `cap add` is not needed.
    # Invokes the local CLI binary directly instead of via npx so the exact
    # Capacitor version from package-lock.json is always used.
    - name: Capacitor Sync
      run: ./node_modules/.bin/cap sync android

    - name: Grant Gradle execute permission
      run: chmod +x android/gradlew

    - name: Build Debug APK
      working-directory: ./android
      run: ./gradlew assembleDebug --no-daemon --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: tether-debug-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
